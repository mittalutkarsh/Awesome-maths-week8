<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lesson: guided problems · Geometric sequences</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet"><style>
/* Math notebook: graph-paper ground, navy fountain-pen ink, a yellow highlighter, a red correction pen.
   Two typefaces: Atkinson Hyperlegible (text, built for young readers) and Kalam (the handwritten voice). */
:root{
  --paper:#FBFCFE; --sheet:#FFFFFF; --rule:#DCE5F2; --rule2:#C9D6EA;
  --ink:#1C2A4A; --pencil:#5E6A82; --faint:#8E99AE;
  --hl:#FFE45E; --hl-soft:#FFF4B8; --red:#C23A2E; --green:#1E7A50; --blue:#2D6BD0;
  --p1:#2D6BD0; --p2:#D98A00; --p3:#7B4CC0; --p4:#1E7A50; --p5:#138A8A; --p6:#C2407A;
  --console:#14223F; --console-ink:#DDE6F6;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:5px; --r-md:9px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
body.reading{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:local}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--hand);font-weight:700;line-height:1.15;color:var(--ink);margin:0 0 .4em}
h1{font-size:2.5rem}
h2{font-size:1.9rem}
h3{font-size:1.4rem}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:var(--r-sm);padding:.35em .8em;font-size:.95rem}
.btn:hover{background:var(--hl-soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2B3E68}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--red);color:var(--red)}
kbd{font-family:var(--text);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:4px;padding:0 .3em;font-size:.85em}

/* ---------- equations ---------- */
.eq{font-size:1.35rem;text-align:center;padding:.7em .6em;margin:.2em 0 1em;border-left:4px solid var(--ink);
  background:var(--sheet);display:flex;flex-wrap:wrap;gap:.35em;align-items:center;justify-content:center}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid var(--ink);padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.binom{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;padding:0 .35em;position:relative;line-height:1.1}
.binom::before,.binom::after{content:"";position:absolute;top:0;bottom:0;width:.35em;border:1.5px solid var(--ink)}
.binom::before{left:0;border-right:none;border-radius:.6em 0 0 .6em}
.binom::after{right:0;border-left:none;border-radius:0 .6em .6em 0}
.eqnote{font-size:.85rem;color:var(--pencil)}

/* ---------- SVG pictures ---------- */
svg.pic{width:100%;height:auto;max-height:340px;display:block;margin:0 auto;font-family:var(--text);overflow:visible}
.pic .t,.pic .cap{fill:var(--pencil);font-size:12px}
.pic .vert{writing-mode:tb}
.pic .chip{fill:#fff;stroke:var(--ink);stroke-width:1.3}
.pic .chip.picked{fill:var(--hl);stroke:var(--ink)}
.pic .chip.used{fill:#EEF1F6;stroke:#B6BECC}
.pic .chip.banned{fill:#FBE9E7;stroke:var(--red)}
.pic .chiptxt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .chiptxt.used{fill:#9AA4B5}
.pic .strike{stroke-width:2;stroke-linecap:round}
.pic .strike.used{stroke:#9AA4B5}
.pic .strike.banned{stroke:var(--red)}
.pic .strike.big{stroke-width:3.5;opacity:.85}
.pic .sub{font-size:9px}
.pic .chip.p1,.pic .tile.p1{fill:#E1ECFC;stroke:var(--p1)}
.pic .chip.p2,.pic .tile.p2{fill:#FCEFD6;stroke:var(--p2)}
.pic .chip.p3,.pic .tile.p3{fill:#ECE3F8;stroke:var(--p3)}
.pic .chip.p4,.pic .tile.p4{fill:#DEF1E7;stroke:var(--p4)}
.pic .chip.p5,.pic .tile.p5{fill:#DAF0F0;stroke:var(--p5)}
.pic .chip.p6,.pic .tile.p6{fill:#F8E1EB;stroke:var(--p6)}
.pic .tile{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .tile.real{fill:var(--hl)}
.pic .tile.pl{fill:#F1F3F7;stroke:#9AA4B5}
.pic .tilet{fill:var(--ink);font-size:16px;font-weight:700}
.pic .tilet.sm{font-size:13px}
.pic .slot{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.pic .result{fill:var(--hl);stroke:var(--ink);stroke-width:1.6}
.pic .fracline{stroke:var(--ink);stroke-width:1.6}
.pic .numbox{fill:#fff;stroke:var(--ink);stroke-width:1.2}
.pic .slotlab{fill:var(--pencil);font-size:12px}
.pic .slotn,.pic .calcn{fill:var(--ink);font-size:20px;font-weight:700}
.pic .op{fill:var(--ink);font-size:22px;font-weight:700}
.pic .op.big{font-size:30px}
.pic .card{fill:#fff;stroke:var(--rule2)}
.pic .arrow{stroke:var(--ink);stroke-width:2;fill:none}
.pic .ahead{fill:var(--ink)}
.pic .groupbox{fill:var(--hl-soft);stroke:var(--ink);stroke-width:1.6}
.pic .groupt{fill:var(--ink);font-size:17px;font-weight:700}
.pic .pg-cell{fill:#fff;stroke:var(--rule2);stroke-width:1}
.pic .pg-cell.diag{fill:#FBE9E7}
.pic .pg-cell.lower{fill:#EEF1F6}
.pic .pg-cell.hl,.pic .pg-cell.twin-lit{fill:var(--hl);stroke:var(--ink)}
.pic .pg-cell:hover{stroke:var(--ink);stroke-width:2}
.pic .pgt{fill:var(--ink);pointer-events:none}
.pic .pgt.dim{fill:#9AA4B5}
.pic .gridlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .edge{stroke:var(--pencil);stroke-width:1.3}
.pic .tnode{fill:#fff;stroke:var(--rule2)}
.pic .nodet{fill:var(--ink);font-size:12px;font-weight:700}
.pic .node.root{fill:var(--ink)}
.pic .rowhl{fill:var(--hl-soft)}
.pic .brace{fill:none;stroke:var(--ink);stroke-width:1.6}
.pic .seg{stroke:var(--faint);stroke-width:1.6}
.pic .seg.hl{stroke:var(--blue);stroke-width:4;stroke-linecap:round;opacity:.85}
.pic .seg.hl2{stroke:var(--p2);stroke-width:4;stroke-linecap:round;opacity:.8}
.pic .dot{fill:var(--ink)}
.pic .dotlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .gl{stroke:var(--rule2);stroke-width:1.3}
.pic .gl.hlv{stroke:var(--blue);stroke-width:3.5}
.pic .gl.hlh{stroke:var(--green);stroke-width:3.5}
.pic .numv{fill:var(--blue);font-weight:700}
.pic .numh{fill:var(--green);font-weight:700}
.pic .shade{fill:var(--hl);opacity:.6}
.pic .path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pic .path.leg1{stroke:var(--blue)}
.pic .path.leg2{stroke:var(--p2);stroke-dasharray:7 4}
.pic .bag{fill:#F4F7FC;stroke:var(--ink);stroke-width:1.5}
.pic .oval{fill:none;stroke:var(--hl);stroke-width:8;opacity:.9}
.pic .oval.diff{stroke:#F2C2BC}
.pic .lcell{fill:#fff;stroke:var(--rule2)}
.pic .lcell.hl{fill:var(--hl)}
.pic .lt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .wcard{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .wcard.skip{fill:#F3F5F9;stroke:#B6BECC;stroke-dasharray:5 4}
.pic .cardt{fill:var(--ink);font-size:15px}
.pic .coin.gold{fill:#F7D774;stroke:#9A7400}
.pic .coin.silver{fill:#E3E7EE;stroke:#7D8696}
.pic .coint{fill:var(--ink);font-size:11px;font-weight:700}
.pic .badring{fill:none;stroke:var(--red);stroke-width:2.5}
.pic .state{fill:#fff;stroke:var(--rule2)}
.pic .state.picked{fill:var(--hl-soft);stroke:var(--ink)}
.pic .person{fill:var(--hl-soft);stroke:var(--ink)}
.pic .persont{fill:var(--ink);font-weight:700;font-size:13px}
.hstack{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.hstack>svg.pic{width:100%;flex:1 1 200px;min-width:0}
.vstack{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.vstack>svg.pic{width:100%}
.ptable{border-collapse:collapse;margin:0 auto;font-size:.92rem;background:#fff}
.ptable th,.ptable td{border:1px solid var(--rule2);padding:.25em .6em;text-align:center}
.ptable th{background:#EEF3FA;font-weight:700}
.ptable tr.hl td{background:var(--hl-soft);font-weight:700}

/* ---------- story component ---------- */
.story{container-type:inline-size;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem;margin:.6rem 0 1.2rem}
.story:focus-visible{outline:3px solid var(--blue)}
.story .frame{display:none;margin:0}
.story .frame.on{display:block}
.story.all .frame{display:block;border-bottom:1px dashed var(--rule2);padding-bottom:.8rem;margin-bottom:.8rem}
.frame .pic-wrap{min-height:80px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.frame figcaption{margin-top:.5rem}
.frame figcaption p{margin:.2em 0}
.frame .ftitle{font-family:var(--hand);font-size:1.15rem;margin:0 0 .3rem}
.frame.skip .ftitle{text-decoration:line-through;color:var(--faint)}
.frame.skip figcaption p{color:var(--pencil)}
.ask{margin-top:.5rem;padding:.4rem .7rem;border-left:4px solid var(--hl);background:#FFFBE6;font-size:.95rem}
.ask b{font-family:var(--hand)}
.story-ctl{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;padding:0}
.dots button.on{background:var(--ink)}
.dots button.seen{background:var(--rule2)}
.story-ctl label{font-size:.9rem;color:var(--pencil);margin-left:auto}
.story.all .story-ctl .nav{visibility:hidden}

/* plan-guided: flowchart beside picture on wide containers, step strip on narrow */
.wbody{display:block}
.plan-side{display:none}
.plan-strip{display:flex;gap:4px;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.plan-strip span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule2);display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;color:var(--pencil)}
.plan-strip span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-strip span.skipd{text-decoration:line-through}
.plan-strip .stepname{font-family:var(--hand);font-size:1.1rem;color:var(--ink);margin-left:.4rem;width:auto;height:auto;border:none;justify-content:flex-start}
@container (min-width:680px){
  .wbody{display:grid;grid-template-columns:215px 1fr;gap:1rem}
  .plan-side{display:block}
  .plan-strip{display:none}
}
.plan-side ol{list-style:none;margin:0;padding:0;counter-reset:pl}
.plan-side li{counter-increment:pl;padding:.35rem .5rem .35rem 2.1rem;position:relative;font-size:.9rem;color:var(--pencil);border-radius:6px;margin-bottom:3px}
.plan-side li::before{content:counter(pl);position:absolute;left:.4rem;top:.3rem;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.plan-side li.on{background:var(--hl);color:var(--ink);font-weight:700}
.plan-side li.on::before{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-side li.skipd{text-decoration:line-through}
.plan-side li+li::after{content:"";position:absolute;left:1.05rem;top:-4px;height:5px;border-left:1.5px solid var(--rule2)}

/* ---------- reading pages ---------- */
.page{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem;display:grid;grid-template-columns:230px minmax(0,1fr);gap:2rem}
.toc{position:sticky;top:1rem;align-self:start;max-height:calc(100vh - 2rem);overflow:auto;font-size:.92rem;background:var(--sheet);
  border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem}
.toc a{display:block;text-decoration:none;color:var(--ink);padding:.15rem .3rem;border-radius:4px}
.toc a:hover{background:var(--hl-soft)}
.toc .sub{padding-left:1rem;font-size:.86rem;color:var(--pencil)}
main.reading-main{min-width:0}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:1.3rem 1.4rem;margin-bottom:1.6rem}
.sheet>p,.sheet li{max-width:72ch}
.idea{font-size:1.1rem;font-weight:700}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.chips a{border:1.5px solid var(--ink);border-radius:999px;padding:.1rem .7rem;text-decoration:none;color:var(--ink);font-size:.9rem;background:#fff}
.chips a:hover{background:var(--hl)}
.fromclass{border-left:4px solid var(--blue);background:#F1F6FE;padding:.6rem .8rem;margin:.8rem 0;font-size:.95rem}
.fromclass b{font-family:var(--hand)}
.traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;padding:0;list-style:none}
.traps li{background:#fff;border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.7rem .9rem;max-width:none}
.traps .wrong{color:var(--red);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.cheat{width:100%;border-collapse:collapse}
.cheat td,.cheat th{border:1px solid var(--rule2);padding:.4rem .6rem;vertical-align:top;text-align:left}
.cheat th{background:#EEF3FA}
dl.gloss dt{font-weight:700;margin-top:.6rem}
dl.gloss dd{margin:0 0 0 1rem;max-width:70ch}
.site-head{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;padding:1rem 1.2rem 0;max-width:1180px;margin:0 auto}
.site-head nav a{margin-right:1rem}
.lede{font-size:1.15rem;max-width:62ch}

/* ---------- workbench ---------- */
body.bench{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.6rem;padding:.45rem .8rem;border-bottom:1.5px solid var(--ink);background:var(--sheet);flex-wrap:wrap}
.topbar .brand{font-family:var(--hand);font-weight:700;font-size:1.25rem;margin-right:.4rem}
.topbar select{font:inherit;font-size:.92rem;padding:.25rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);max-width:280px}
.topbar .meta{font-size:.9rem;color:var(--pencil);display:flex;gap:1rem;align-items:center}
.topbar .links{margin-left:auto;display:flex;gap:.8rem;font-size:.92rem}
.benchgrid{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(360px,430px)}
.rail{border-right:1.5px solid var(--ink);overflow:auto;padding:.5rem;background:var(--paper)}
.rail h4{font-family:var(--hand);font-size:1.05rem;margin:.6rem 0 .2rem}
.rail button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:none;background:none;padding:.25rem .4rem;border-radius:5px;font-size:.92rem;color:var(--ink)}
.rail button:hover{background:var(--hl-soft)}
.rail button.cur{background:var(--hl);font-weight:700}
.sdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--pencil);flex:none}
.sdot.prog{background:linear-gradient(90deg,var(--blue) 50%,#fff 50%);border-color:var(--blue)}
.sdot.closed{background:var(--green);border-color:var(--green)}
.middle{overflow:auto;padding:0 1rem 1rem;background:var(--paper)}
.tabs{display:flex;gap:.2rem;position:sticky;top:0;background:var(--paper);padding-top:.5rem;z-index:2;border-bottom:1.5px solid var(--ink)}
.tabs button{border:1.5px solid var(--ink);border-bottom:none;border-radius:7px 7px 0 0;background:#EEF3FA;padding:.3rem .9rem;margin-bottom:-1.5px;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--sheet);font-weight:700}
.tabpanel{padding-top:.8rem}
.ptext{font-size:1.08rem;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.pfig{max-width:380px;margin:.8rem auto 0}
.pfig svg.pic{max-height:300px}
.pfig .pic .gl{stroke:var(--ink);stroke-width:1.2}
.pnote{font-size:.9rem;color:var(--pencil);margin:.5rem 0}
.inclass{display:inline-block;font-size:.85rem;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:0 .6rem;margin-right:.4rem}
.above{display:inline-block;font-size:.85rem;border:1px solid var(--p3);color:var(--p3);border-radius:999px;padding:0 .6rem}
.verified{margin-top:1rem;border:2px solid var(--green);border-radius:var(--r-md);background:#F2FAF5;padding:.8rem 1rem}
.verified h3{color:var(--green)}
.right{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0;background:var(--sheet)}
.rscroll{overflow:auto;padding:.7rem .8rem;flex:1;min-height:0}
.pills{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.pills button{border:1.5px solid var(--ink);border-radius:999px;background:#fff;padding:.05rem .65rem;font-size:.88rem}
.pills button.cur{outline:3px solid var(--hl);outline-offset:1px;font-weight:700}
.pills button.ok{background:#DDF1E5;border-color:var(--green)}
.pills button.handed{background:#FBE9E7;border-color:var(--red)}
.pills button.tried{background:#EEF3FA}
.stepq{font-weight:700;margin:.2rem 0 .5rem}
.editor{display:flex;border:1.5px solid var(--ink);border-radius:var(--r-sm);height:140px;background:#fff;
  background-image:linear-gradient(transparent 23px,var(--rule) 23px);background-size:100% 24px;background-position:0 6px}
.gutter{width:2.2rem;text-align:right;padding:6px .35rem 0 0;color:var(--faint);font-size:.85rem;line-height:24px;overflow:hidden;border-right:1px solid var(--rule2);user-select:none}
.editor textarea{flex:1;border:none;resize:none;padding:6px .5rem 0;font:inherit;font-size:.95rem;line-height:24px;background:transparent;color:var(--ink);font-family:var(--hand)}
.editor textarea:focus{outline:none}
.editor:focus-within{outline:3px solid var(--blue);outline-offset:1px}
.ansrow{display:flex;gap:.4rem;margin:.6rem 0}
.ansrow input{flex:1;font:inherit;padding:.35rem .5rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);min-width:0}
.btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.console{background:var(--console);color:var(--console-ink);font-size:.86rem;padding:.6rem .7rem;height:170px;overflow:auto;border-top:1.5px solid var(--ink);flex:none}
.console div{margin-bottom:.3rem;line-height:1.4}
.console .ok{color:#8BE0AC}
.console .bad{color:#FFB3A8}
.console .info{color:#A9C3F0}
.console .hand{color:#FFE45E}
.console .ts{color:#6F84AD;margin-right:.4rem}
.dialog-back{position:fixed;inset:0;background:rgba(28,42,74,.35);display:none;align-items:center;justify-content:center;z-index:50}
.dialog-back.open{display:flex}
.dialog{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--r-md);max-width:460px;padding:1rem 1.2rem;margin:1rem}
.dialog h3{margin-top:0}
.confirm-note{font-size:.88rem;color:var(--red);margin:.3rem 0}
.rules{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.rules ol{padding-left:1.3rem;margin:.3rem 0}
.mysteps .ms{background:var(--sheet);border:1px solid var(--rule2);border-radius:var(--r-sm);padding:.5rem .7rem;margin-bottom:.5rem}
.mysteps pre{white-space:pre-wrap;font-family:var(--hand);margin:.3rem 0;font-size:.95rem}
.railtoggle{display:none}

/* ---------- pen ---------- */
.pen-canvas{position:fixed;inset:0;pointer-events:none;z-index:40}
.pen-canvas.active{pointer-events:auto;cursor:crosshair}
.pen-canvas.active.touchpass{touch-action:pan-x pan-y pinch-zoom}
.pen-canvas.active.swallow{touch-action:none}
.pen-bar{position:fixed;right:12px;bottom:12px;z-index:45;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);
  padding:.35rem;display:flex;gap:.25rem;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px);box-shadow:0 2px 0 var(--ink)}
.pen-bar button{border:1.5px solid transparent;background:none;border-radius:6px;min-width:30px;height:30px;padding:0 .35rem;font-size:.85rem;color:var(--ink)}
.pen-bar button[aria-pressed="true"]{border-color:var(--ink);background:var(--hl)}
.pen-bar .sw{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;border:1.5px solid var(--ink)}
.pen-bar .tools{display:none;gap:.2rem;align-items:center;flex-wrap:wrap}

=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"183.0\" y=\"132.0\" class=\"rval\" text-anchor=\"middle\">20<\/text><rect x=\"234\" y=\"106\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"257.0\" y=\"132.0\" class=\"rval\" text-anchor=\"middle\">40<\/text><line x1=\"61\" y1=\"132.0\" x2=\"79\" y2=\"132.0\" class=\"rarrow\"/><path d=\"M76,128.0 L83,132.0 L76,136.0\" class=\"rhead\"/><text x=\"72.0\" y=\"120.0\" class=\"rop\" text-anchor=\"middle\">\u00d72<\/text><line x1=\"135\" y1=\"132.0\" x2=\"153\" y2=\"132.0\" class=\"rarrow\"/><path d=\"M150,128.0 L157,132.0 L150,136.0\" class=\"rhead\"/><text x=\"146.0\" y=\"120.0\" class=\"rop\" text-anchor=\"middle\">\u00d72<\/text><line x1=\"209\" y1=\"132.0\" x2=\"227\" y2=\"132.0\" class=\"rarrow\"/><path d=\"M224,128.0 L231,132.0 L224,136.0\" class=\"rhead\"/><text x=\"220.0\" y=\"120.0\" class=\"rop\" text-anchor=\"middle\">\u00d72<\/text><\/svg><\/div><figcaption><p>Divide each pile by the one before. Every division gives 2: the common ratio r = 2.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 366 78\" role=\"img\" aria-label=\"ladder\" style=\"max-width:531px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"35.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">a<\/text><rect x=\"12\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"35.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">5<\/text><text x=\"109.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">ar<\/text><rect x=\"86\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"109.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">10<\/text><text x=\"183.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">ar\u00b2<\/text><rect x=\"160\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"183.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">20<\/text><text x=\"257.0\" y=\"22\" class=\"rtop\" text-anchor= ss=\"rhead\"/><text x=\"280.0\" y=\"22.0\" class=\"rop\" text-anchor=\"middle\">\u00d7(\u22123)<\/text><line x1=\"355\" y1=\"34.0\" x2=\"397\" y2=\"34.0\" class=\"rarrow\"/><path d=\"M394,30.0 L401,34.0 L394,38.0\" class=\"rhead\"/><text x=\"378.0\" y=\"22.0\" class=\"rop\" text-anchor=\"middle\">\u00d7(\u22123)<\/text><\/svg><\/div><\/div><figcaption><p>List both possibilities: r = 3 and r = \u22123. They agree on odd rungs and differ in sign on even ones.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 300 106\" role=\"img\" aria-label=\"Yes: r\u00b2 = 9 hides a \u00b1: the fourth rung is 81 or \u221281.\" style=\"max-width:435px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"292\" height=\"98\" rx=\"10\" class=\"wcard\"/><text x=\"150.0\" y=\"40\" class=\"yn yes\" text-anchor=\"middle\">Yes<\/text><text x=\"150.0\" y=\"66\" class=\"cardt\" text-anchor=\"middle\">r\u00b2 = 9 hides a \u00b1:<\/text><text x=\"150.0\" y=\"90\" class=\"cardt\" text-anchor=\"middle\">the fourth rung is 81 or \u221281.<\/text><\/svg><\/div><figcaption><p>The fourth rung is ar\u00b3, an odd power: it keeps the sign. Two answers.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>you know<\/th><th>you want<\/th><th>move<\/th><\/tr><\/thead><tbody><tr><td>r\u00b2<\/td><td>r\u2074<\/td><td>square<\/td><\/tr><tr><td>r\u2074<\/td><td>r\u00b9\u00b2<\/td><td>cube<\/td><\/tr><tr><td>r\u00b3<\/td><td>r\u2076<\/td><td>square<\/td><\/tr><tr class=\"hl\"><td>r\u00b2<\/td><td>r\u2076<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill in the last row. The rule: divide to a power of r, then multiply powers to get the one you need.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "C3": "<h2>Finite sums<\/h2><div class=\"eq\" role=\"math\"><span>a + ar + \u22ef + ar<sup>n<\/sup><\/span><span>=<\/span><span>a \u00b7<\/span><span><span class=\"frac\"><span>1 \u2212 r<sup>n+1<\/sup><\/span><span>1 \u2212 r<\/span><\/span><\/span><\/div><p class=\"idea\">Find a, find r, find the next rung r^(n+1); the sum is a(1 \u2212 r^(n+1)) \u00f7 (1 \u2212 r).<\/p><div class=\"story concept\" id=\"story9\" tabindex=\"0\" aria-label=\"Finite sums story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 440 166\" role=\"img\" aria-label=\"coins per day\" style=\"max-width:638px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"92\" y=\"26\" class=\"rtop\" text-anchor=\"end\">Mon<\/text><rect x=\"100\" y=\"12\" width=\"0.48\" height=\"20\" rx=\"4\" class=\"pseg s0\"/><text x=\"106.48\" y=\"27\" class=\"rtop\" text-anchor=\"start\">2 coins<\/text><text x=\"92\" y=\"56\" class=\"rtop\" text-anchor=\"end\">Tue<\/text><rect x=\"100\" y=\"42\" width=\"2.4\" height=\"20\" rx=\"4\" class=\"pseg s1\"/><text x=\"108.4\" y=\"57\" class=\"rtop\" text-anchor=\"start\">10<\/text><text x=\"92\" y=\"86\" class=\"rtop\" text-anchor=\"end\">Wed<\/text><rect x=\"100\" y=\"72\" width=\"12.0\" height=\"20\" rx=\"4\" class=\"pseg s0\"/><text x=\"118.0\" y=\"87\" class=\"rtop\" text-anchor=\"start\">50<\/text><text x=\"92\" y=\"116\" class=\"rtop\" text-anchor=\"end\">Thu<\/text><rect x=\"100\" y=\"102\" width=\"60.0\" height=\"20\" rx=\"4\" class=\"pseg s1\"/><text x=\"166.0\" y=\"117\" class=\"rtop\" text-anchor=\"start\">250<\/text><text x=\"92\" y=\"146\" class=\"rtop\" text-anchor=\"end\">Fri<\/text><rect x=\"100\" y=\"132\" width=\"300.0\" height=\"20\" rx=\"4\" class=\"pseg s0\"/><text x=\"406.0\" y=\"147\" class=\"rtop\" text-anchor=\"start\">1250<\/text><\/svg><\/div><figcaption><p>Save 2 coins on Monday, then five times as many each day: 2, 10, 50, 250, 1250. How many coins by Friday?<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 449 92\" role=\"img\" aria-label=\"calculation\" style=\"max-width:651px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"148\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"84.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(2 + 1250)<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"205\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"220.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5<\/text><text x=\"259.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"283\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"298.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2<\/text><text x=\"337.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"361\" y=\"16\" width=\"70\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"396.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3130<\/text><line x1=\"6\" y1=\"60\" x2=\"443\" y2=\"12\" class=\"strike banned big\"/><text x=\"224.5\" y=\"86\" class=\"cap\" text-anchor=\"middle\">pairs the ends: needs equal steps<\/text><\/svg><\/div><figcaption><p>Last week&#x27;s trick, pairing the ends, gives 3130. It only works for equal steps. Here the ends don&#x27;t pair (the teacher, 32:04).<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 748 70\" role=\"img\" aria-label=\"calculation\" style=\"max-width:1085px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"330\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"175.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2 + 10 + 50 + 250 + 1250<\/text><text x=\"363.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"387\" y=\"16\" width=\"343\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"558.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2(1 + 5 + 25 + 125 + 625)<\/text><\/svg><\/div><figcaption><p>Factor out a = 2. What&#x27;s left is 1 + r + r\u00b2 + r\u00b3 + r\u2074.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 526 154\" role=\"img\" aria-label=\"shifted copy\" style=\"max-width:763px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"46\" y=\"40\" class=\"rop\" text-anchor=\"end\">T =<\/text><rect x=\"52\" y=\"14\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox hl\"/><text x=\"79.0\" y=\"39\" class=\"rval\" text-anchor=\"middle\">1<\/text><text x=\"119.0\" y=\"39\" class=\"rop\" text-anchor=\"middle\">+<\/text><rect x=\"132\" y=\"14\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox dim\"/><text x=\"159.0\" y=\"39\" class=\"rval dim\" text-anchor=\"middle\">5<\/text><line x1=\"136\" y1=\"48\" x2=\"182\" y2=\"18\" class=\"strike banned\"/><text x=\"199.0\" y=\"39\" class=\"rop\" text-anchor=\"middle\">+<\/text><rect x=\"212\" y=\"14\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox dim\"/><text x=\"239.0\" y=\"39\" class=\"rval dim\" text-anchor=\"middle\">25<\/text><line x1=\"216\" y1=\"48\" x2=\"262\" y2=\"18\" class=\"strike banned\"/><text x=\"279.0\" y=\"39\" class=\"rop\" text-anchor=\"middle\">+<\/text><rect x=\"292\" y=\"14\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox dim\"/><text x=\"319.0\" y=\"39\" class=\"rval dim\" text-anchor=\"middle\">125<\/text><line x1=\"296\" y1=\"48\" x2=\"342\" y2=\"18\" class=\"strike banned\"/><text x=\"359.0\" y=\"39\" class=\"rop\" text-anchor=\"middle\">+<\/text><rect x=\"372\" y=\"14\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox dim\"/><text x=\"399.0\" y=\"39\" class=\"rval dim\" text-anchor=\"middle\">625<\/text><line x1=\"376\" y1=\"48\" x2=\"422\" y2=\"18\" class=\"strike banned\"/><text x=\"46\" y=\"96\" class=\"rop\" text-anchor=\"end\">5T =<\/text><rect x=\"132\" y=\"70\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox dim\"/><text x=\"159.0\" y=\"95\" class=\"rval dim\" text-anchor=\"middle\">5<\/text><line x1=\"136\" y1=\"104\" x2=\"182\" y2=\"74\" class=\"strike banned\"/><text x=\"199.0\" y=\"95\" class=\"rop\" text-anchor=\"middle\">+<\/text><rect x=\"212\" y=\"70\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox dim\"/><text x=\"239.0\" y=\"95\" class=\"rval dim\" text-anchor=\"middle\">25<\/text><line x1=\"216\" y1=\"104\" x2=\"262\" y2=\"74\" class=\"strike banned\"/><text x=\"279.0\" y=\"95\" class=\"rop\" text-anchor=\"middle\">+<\/text><rect x=\"292\" y=\"70\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox dim\"/><text x=\"319.0\" y=\"95\" class=\"rval dim\" text-anchor=\"middle\">125<\/text><line x1=\"296\" y1=\"104\" x2=\"342\" y2=\"74\" class=\"strike banned\"/><text x=\"359.0\" y=\"95\" class=\"rop\" text-anchor=\"middle\">+<\/text><rect x=\"372\" y=\"70\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox dim\"/><text x=\"399.0\" y=\"95\" class=\"rval dim\" text-anchor=\"middle\">625<\/text><line x1=\"376\" y1=\"104\" x2=\"422\" y2=\"74\" class=\"strike banned\"/><text x=\"439.0\" y=\"95\" class=\"rop\" text-anchor=\"middle\">+<\/text><rect x=\"452\" y=\"70\" width=\"54\" height=\"38\" rx=\"7\" class=\"rbox hl\"/><text x=\"479.0\" y=\"95\" class=\"rval\" text-anchor=\"middle\">3125<\/text><text x=\"263.0\" y=\"148\" class=\"cap\" text-anchor=\"middle\">5T \u2212 T = 3125 \u2212 1<\/text><\/svg><\/div><figcaption><p>Multiply by r = 5 and line the copy up one rung over. Every middle rung cancels; only 3125 and 1 survive.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does shifting by one rung make the middles cancel?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 456 78\" role=\"img\" aria-label=\"ladder\" style=\"max-width:661px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"35.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">a<\/text><rect x=\"12\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"35.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">2<\/text><text x=\"109.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">ar<\/text><rect x=\"86\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"109.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">10<\/text><text x=\"183.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">ar\u00b2<\/text><rect x=\"160\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"183.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">50<\/text><text x=\"257.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">ar\u00b3<\/text><rect x=\"234\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"257.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">250<\/text><text x=\"335.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">ar\u2074<\/text><rect x=\"308\" y=\"28\" width=\"54\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"335.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">1250<\/text><text x=\"417.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">ar\u2075<\/text><rect x=\"390\" y=\"28\" width=\"54\" height=\"40\" rx=\"7\" class=\"rbox ghost\"/><text x=\"417.0\" y=\"54.0\" class=\"rval dim\" text-anchor=\"middle\">6250<\/text><line x1=\"61\" y1=\"54.0\" x2=\"79\" y2=\"54.0\" class=\"rarrow\"/><path d=\"M76,50.0 L83,54.0 L76,58.0\" class=\"rhead\"/><text x=\"72.0\" y=\"42.0\" class=\"rop\" text-anchor=\"middle\">\u00d75<\/text><line x1=\"135\" y1=\"54.0\" x2=\"153\" y2=\"54.0\" class=\"rarrow\"/><path d=\"M150,50.0 L157,54.0 L150,58.0\" class=\"rhead\"/><text x=\"146.0\" y=\"42.0\" class=\"rop\" text-anchor=\"middle\">\u00d75<\/text><line x1=\"209\" y1=\"54.0\" x2=\"227\" y2=\"54.0\" class=\"rarrow\"/><path d=\"M224,50.0 L231,54.0 L224,58.0\" class=\"rhead\"/><text x=\"220.0\" y=\"42.0\" class=\"rop\" text-anchor=\"middle\">\u00d75<\/text><line x1=\"283\" y1=\"54.0\" x2=\"301\" y2=\"54.0\" class=\"rarrow\"/><path d=\"M298,50.0 L305,54.0 L298,58.0\" class=\"rhead\"/><text x=\"294.0\" y=\"42.0\" class=\"rop\" text-anchor=\"middle\">\u00d75<\/text><line x1=\"365\" y1=\"54.0\" x2=\"383\" y2=\"54.0\" class=\"rarrow\"/><path d=\"M380,50.0 L387,54.0 L380,58.0\" class=\"rhead\"/><text x=\"376.0\" y=\"42.0\" class=\"rop\" text-anchor=\"middle\">\u00d75<\/text><\/svg><\/div><figcaption><p>3125 = 5\u2075 is the power of r on the rung after the last (dashed). The teacher: find a, find r, find n + 1.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 462 70\" role=\"img\" aria-label=\"calculation\" style=\"max-width:670px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"161\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"90.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2(1 \u2212 3125)<\/text><text x=\"194.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"218\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"272.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(1 \u2212 5)<\/text><text x=\"350.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"374\" y=\"16\" width=\"70\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"409.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">1562<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 475 70\" role=\"img\" aria-label=\"calculation\" style=\"max-width:689px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"330\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"175.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2 + 10 + 50 + 250 + 1250<\/text><text x=\"363.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"387\" y=\"16\" width=\"70\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"422.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">1562<\/text><\/svg><\/div><\/div><figcaption><p>S = 2(1 \u2212 3125) \u00f7 (1 \u2212 5) = 1562. Adding directly agrees.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>sum<\/th><th>next rung (r = 5)<\/th><th>total<\/th><\/tr><\/thead><tbody><tr><td>1 + 5<\/td><td>25<\/td><td>6<\/td><\/tr><tr><td>1 + 5 + 25<\/td><td>125<\/td><td>31<\/td><\/tr><tr><td>1 + 5 + 25 + 125<\/td><td>625<\/td><td>156<\/td><\/tr><tr class=\"hl\"><td>1 + 5 + 25 + 125 + 625<\/td><td>?<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill in the last row. The rule: with a = 1, the total is (next rung \u2212 1) \u00f7 (r \u2212 1).<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "C4": "<h2>Forever sums<\/h2><div class=\"eq\" role=\"math\"><span>a + ar + ar\u00b2 + \u22ef<\/span><span>=<\/span><span><span class=\"frac\"><span>a<\/span><span>1 \u2212 r<\/span><\/span><\/span><span>&nbsp;&nbsp;<\/span><span>only when \u22121 < r < 1<\/span><\/div><p class=\"idea\">When \u22121 &lt; r &lt; 1 the next rung shrinks to 0, so the finite formula becomes a \u00f7 (1 \u2212 r).<\/p><div class=\"story concept\" id=\"story10\" tabindex=\"0\" aria-label=\"Forever sums story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 470 120\" role=\"img\" aria-label=\"Zeno&#x27;s halves\" style=\"max-width:682px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"22\" y=\"46\" width=\"426\" height=\"24\" class=\"pathbg\"/><rect x=\"22.0\" y=\"46\" width=\"213.0\" height=\"24\" class=\"pseg s0\"/><rect x=\"235.0\" y=\"46\" width=\"106.5\" height=\"24\" class=\"pseg s1\"/><rect x=\"341.5\" y=\"46\" width=\"53.25\" height=\"24\" class=\"pseg s0\"/><rect x=\"394.75\" y=\"46\" width=\"26.625\" height=\"24\" class=\"pseg s1\"/><line x1=\"235.0\" y1=\"40\" x2=\"235.0\" y2=\"76\" class=\"ptick\"/><text x=\"235.0\" y=\"36\" class=\"rtop\" text-anchor=\"middle\">\u00bd<\/text><line x1=\"341.5\" y1=\"40\" x2=\"341.5\" y2=\"76\" class=\"ptick\"/><text x=\"341.5\" y=\"36\" class=\"rtop\" text-anchor=\"middle\">\u00be<\/text><line x1=\"394.75\" y1=\"40\" x2=\"394.75\" y2=\"76\" class=\"ptick\"/><text x=\"394.75\" y=\"36\" class=\"rtop\" text-anchor=\"middle\">\u215e<\/text><line x1=\"421.375\" y1=\"40\" x2=\"421.375\" y2=\"76\" class=\"ptick\"/><text x=\"22\" y=\"92\" class=\"cap\" text-anchor=\"middle\">start<\/text><text x=\"448\" y=\"92\" class=\"cap\" text-anchor=\"middle\">end<\/text><line x1=\"448\" y1=\"38\" x2=\"448\" y2=\"78\" class=\"ptick end\"/><text x=\"448\" y=\"110\" class=\"gapt\" text-anchor=\"end\">a gap is always left<\/text><\/svg><\/div><figcaption><p>Zeno&#x27;s path: walk half, then half of what&#x27;s left, again and again. She stops at \u00bd, \u00be, \u215e, 15/16, \u2026<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 300 82\" role=\"img\" aria-label=\"tempting wrong idea\" style=\"max-width:435px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"292\" height=\"74\" rx=\"10\" class=\"wcard \"/><text x=\"150.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">infinitely many steps,<\/text><text x=\"150.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">so the sum is infinite?<\/text><line x1=\"14\" y1=\"68\" x2=\"286\" y2=\"14\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Tempting: infinitely many pieces must add to something infinite. But the pieces shrink fast.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>steps<\/th><th>walked<\/th><th>gap left<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>\u00bd<\/td><td>\u00bd<\/td><\/tr><tr><td>2<\/td><td>\u00be<\/td><td>\u00bc<\/td><\/tr><tr><td>3<\/td><td>\u215e<\/td><td>\u215b<\/td><\/tr><tr class=\"hl\"><td>10<\/td><td>1023/1024<\/td><td>1/1024<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>List it. After n steps the gap is (\u00bd)\u207f, smaller each time.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 224 224\" role=\"img\" aria-label=\"square filled by halves\" style=\"max-width:325px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"12.0\" y=\"12.0\" width=\"200.0\" height=\"200.0\" class=\"sqbg\"/><rect x=\"12.0\" y=\"12.0\" width=\"100.0\" height=\"200.0\" class=\"pseg s0\"/><text x=\"62.0\" y=\"117.0\" class=\"rval\" text-anchor=\"middle\" style=\"font-size:18px\">\u00bd<\/text><rect x=\"112.0\" y=\"12.0\" width=\"100.0\" height=\"100.0\" class=\"pseg s1\"/><text x=\"162.0\" y=\"67.0\" class=\"rval\" text-anchor=\"middle\" style=\"font-size:18px\">\u00bc<\/text><rect x=\"112.0\" y=\"112.0\" width=\"50.0\" height=\"100.0\" class=\"pseg s0\"/><text x=\"137.0\" y=\"167.0\" class=\"rval\" text-anchor=\"middle\" style=\"font-size:16px\">\u215b<\/text><rect x=\"162.0\" y=\"112.0\" width=\"50.0\" height=\"50.0\" class=\"pseg s1\"/><text x=\"187.0\" y=\"142.0\" class=\"rval\" text-anchor=\"middle\" style=\"font-size:16px\">1/16<\/text><rect x=\"162.0\" y=\"162.0\" width=\"25.0\" height=\"50.0\" class=\"pseg s0\"/><text x=\"174.5\" y=\"192.0\" class=\"rval\" text-anchor=\"middle\" style=\"font-size:11px\"><\/text><rect x=\"187.0\" y=\"162.0\" width=\"25.0\" height=\"25.0\" class=\"pseg s1\"/><text x=\"199.5\" y=\"179.5\" class=\"rval\" text-anchor=\"middle\" style=\"font-size:11px\"><\/text><rect x=\"187.0\" y=\"187.0\" width=\"12.5\" height=\"25.0\" class=\"pseg s0\"/><rect x=\"199.5\" y=\"187.0\" width=\"12.5\" height=\"25.0\" class=\"sqleft\"/><\/svg><\/div><figcaption><p>The same halves fill a square. The pieces never stop, but they never spill out of 1.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 322 78\" role=\"img\" aria-label=\"ladder\" style=\"max-width:467px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"27.0\" y=\"54.0\" class=\"rop\" text-anchor=\"middle\" style=\"font-size:20px\">\u2026<\/text><rect x=\"50\" y=\"28\" width=\"54\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"77.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">1/64<\/text><rect x=\"132\" y=\"28\" width=\"64\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"164.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">1/128<\/text><text x=\"267.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">next rung<\/text><rect x=\"224\" y=\"28\" width=\"86\" height=\"40\" rx=\"7\" class=\"rbox ghost\"/><text x=\"267.0\" y=\"54.0\" class=\"rval dim\" text-anchor=\"middle\">\u2192 0<\/text><line x1=\"107\" y1=\"54.0\" x2=\"125\" y2=\"54.0\" class=\"rarrow\"/><path d=\"M122,50.0 L129,54.0 L122,58.0\" class=\"rhead\"/><text x=\"118.0\" y=\"42.0\" class=\"rop\" text-anchor=\"middle\">\u00d7\u00bd<\/text><line x1=\"199\" y1=\"54.0\" x2=\"217\" y2=\"54.0\" class=\"rarrow\"/><path d=\"M214,50.0 L221,54.0 L214,58.0\" class=\"rhead\"/><text x=\"210.0\" y=\"42.0\" class=\"rop\" text-anchor=\"middle\">\u00d7\u00bd<\/text><\/svg><\/div><figcaption><p>In the finite formula a(1 \u2212 r\u207f\u207a\u00b9) \u00f7 (1 \u2212 r), the next rung shrinks to 0. What&#x27;s left is a \u00f7 (1 \u2212 r).<\/p><div class=\"ask\"><b>Ask him:<\/b> What happens to the next rung if r = 2?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 306 92\" role=\"img\" aria-label=\"calculation\" style=\"max-width:444px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">1<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"88\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"142.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(1 \u2212 2)<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"266.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">\u22121<\/text><line x1=\"6\" y1=\"60\" x2=\"300\" y2=\"12\" class=\"strike banned big\"/><text x=\"153.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">1 + 2 + 4 + \u22ef is not \u22121: the next rung grows<\/text><\/svg><\/div><figcaption><p>The teacher&#x27;s warning: 1 + 2 + 4 + \u22ef has r = 2. The next rung grows, so the forever formula doesn&#x27;t apply.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 293 70\" role=\"img\" aria-label=\"calculation\" style=\"max-width:425px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"88\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"142.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(1 \u2212 \u00bc)<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"259.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><\/svg><\/div><figcaption><p>A ratio that works: 3 + \u00be + 3/16 + \u22ef has r = \u00bc, so S = 3 \u00f7 \u00be = 4.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>r<\/th><th>does r\u207f shrink to 0?<\/th><\/tr><\/thead><tbody><tr><td>\u00bd<\/td><td>yes<\/td><\/tr><tr><td>\u2212\u00bd<\/td><td>yes<\/td><\/tr><tr><td>1<\/td><td>no<\/td><\/tr><tr><td>2<\/td><td>no<\/td><\/tr><tr class=\"hl\"><td>0.9<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill in the last row. The rule: the forever sum exists only for \u22121 &lt; r &lt; 1.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "C5": "<h2>Block rungs<\/h2><div class=\"eq\" role=\"math\"><span>block<sub>k+1<\/sub><\/span><span>=<\/span><span>block<sub>k<\/sub><\/span><span>\u00d7<\/span><span>r<sup>(block size)<\/sup><\/span><\/div><p class=\"idea\">When the pattern repeats in blocks, bundle each block into one rung; the blocks form a ladder with ratio r to the block size.<\/p><div class=\"story concept\" id=\"story11\" tabindex=\"0\" aria-label=\"Block rungs story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 414 78\" role=\"img\" aria-label=\"ladder\" style=\"max-width:600px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"35.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">a<\/text><rect x=\"12\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"35.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">1<\/text><text x=\"109.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">ar<\/text><rect x=\"86\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"109.0\" y=\"54.0\" class=\"rval\" text-anchor=\"middle\">\u2154<\/text><text x=\"199.0\" y=\"22\" class=\"rtop\" text-anchor=\"middle\">ar\u00b2<\/text><rect x=\"176\" y=\"28\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><t h=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"142.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(1 \u2212 \u2154)<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"259.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3<\/text><line x1=\"6\" y1=\"60\" x2=\"287\" y2=\"12\" class=\"strike banned big\"/><text x=\"146.5\" y=\"86\" class=\"cap\" text-anchor=\"middle\">uses \u00d7\u2154 for every step<\/text><\/svg><\/div><figcaption><p>Tempting: a = 1, r = \u2154, so 3. But every second step is \u00d71/6, not \u00d7\u2154.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 444 104\" role=\"img\" aria-label=\"ladder\" style=\"max-width:644px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"12\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"35.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">1<\/text><rect x=\"80\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"103.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">\u2154<\/text><rect x=\"148\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"171.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">1/9<\/text><rect x=\"216\" y=\"8\" width=\"54\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"243.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">2/27<\/text><rect x=\"292\" y=\"8\" width=\"54\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"319.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">1/81<\/text><rect x=\"368\" y=\"8\" width=\"64\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"400.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">2/243<\/text><line x1=\"61\" y1=\"34.0\" x2=\"73\" y2=\"34.0\" class=\"rarrow\"/><path d=\"M70,30.0 L77,34.0 L70,38.0\" class=\"rhead\"/><line x1=\"129\" y1=\"34.0\" x2=\"141\" y2=\"34.0\" class=\" ><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill in the last row. The rule: block ratio = r^(block size).<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "C6": "<h2>Ladders to order<\/h2><div class=\"eq\" role=\"math\"><span>term k<\/span><span>=<\/span><span>a \u00b7 r<sup>k\u22121<\/sup><\/span><span>&nbsp;&nbsp;<\/span><span>choose a and r so the whole numbers land where you want<\/span><\/div><p class=\"idea\">Choose a and r so the whole numbers sit on exactly the rungs you want: each factor of r&#x27;s bottom number in a buys one more whole rung.<\/p><div class=\"story concept\" id=\"story12\" tabindex=\"0\" aria-label=\"Ladders to order story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 440 58\" role=\"img\" aria-label=\"ladder\" style=\"max-width:638px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"12\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox int\"/><text x=\"35.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">8<\/text><rect x=\"86\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox int\"/><text x=\"109.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">4<\/text><rect x=\"160\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox int\"/><text x=\"183.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">2<\/text><rect x=\"234\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox int\"/><text x=\"257.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">1<\/text><rect x=\"308\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"331.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">\u00bd<\/text><rect x=\ ">3\u221a3<\/text><rect x=\"340\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox int\"/><text x=\"363.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">9<\/text><rect x=\"422\" y=\"8\" width=\"46\" height=\"40\" rx=\"7\" class=\"rbox \"/><text x=\"445.0\" y=\"34.0\" class=\"rval\" text-anchor=\"middle\">9\u221a3<\/text><line x1=\"61\" y1=\"34.0\" x2=\"87\" y2=\"34.0\" class=\"rarrow\"/><path d=\"M84,30.0 L91,34.0 L84,38.0\" class=\"rhead\"/><text x=\"76.0\" y=\"22.0\" class=\"rop\" text-anchor=\"middle\">\u00d7\u221a3<\/text><line x1=\"143\" y1=\"34.0\" x2=\"169\" y2=\"34.0\" class=\"rarrow\"/><path d=\"M166,30.0 L173,34.0 L166,38.0\" class=\"rhead\"/><text x=\"158.0\" y=\"22.0\" class=\"rop\" text-anchor=\"middle\">\u00d7\u221a3<\/text><line x1=\"225\" y1=\"34.0\" x2=\"251\" y2=\"34.0\" class=\"rarrow\"/><path d=\"M248,30.0 L255,34.0 L248,38.0\" class=\"rhead\"/><text x=\"240.0\" y=\"22.0\" class=\"rop\" text-anchor=\"middle\">\u00d7\u221a3<\/text><line x1=\"307\" y1=\"34.0\" x2=\"333\" y2=\"34.0\" class=\"rarrow\"/><path d=\"M330,30.0 L337,34.0 L330,38.0\" class=\"rhead\"/><text x=\"322.0\" y=\"22.0\" class=\"rop\" text-anchor=\"middle\">\u00d7\u221a3<\/text><line x1=\"389\" y1=\"34.0\" x2=\"415\" y2=\"34.0\" class=\"rarrow\"/><path d=\"M412,30.0 L419,34.0 L412,38.0\" class=\"rhead\"/><text x=\"404.0\" y=\"22.0\" class=\"rop\" text-anchor=\"middle\">\u00d7\u221a3<\/text><\/svg><\/div><figcaption><p>A ratio that isn&#x27;t a fraction: \u221a3. Two steps make \u00d73, so every second rung is whole, forever.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does a fraction ratio always run out of whole numbers, but \u221a3 doesn&#x27;t?<\/div><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><in <script>
/* Answer checker. Exact rationals (BigInt) with a float fallback for square roots, so
   2047/2048, 1 - 1/2048, 5465, 5,465, 3·2⁵, (½)^11, 111√3, 111*sqrt(3), (4+√2)/3, ±111, "111 and -111"
   all read. Constructions (first term, ratio) are checked by property. */
window.CHECK = (function () {
  "use strict";
  function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { [a, b] = [b, a % b]; } return a; }
  function R(n, d) { d = d === undefined ? 1n : d; if (d === 0n) throw new Error("divide by zero"); if (d < 0n) { n = -n; d = -d; } const g = gcd(n, d) || 1n; return { n: n / g, d: d / g }; }
  function toF(r) {
    const s = Number(r.n) / Number(r.d);
    if (isFinite(s) && !(s === 0 && r.n !== 0n)) return s;
    const ln = r.n.toString().replace("-", "").length, ld = r.d.toString().length;
    const shift = Math.max(ln, ld) - 300;
    const k = 10n ** BigInt(Math.max(0, shift));
    return Number(r.n / k) / Number(r.d / k || 1n);
  }
  /* value = {r: rational or null, f: float} */
  const ex = (r) => ({ r, f: toF(r) });
  const fl = (f) => ({ r: null, f });
  const isInt = (a) => !!a.r && a.r.d === 1n;
  function bin(a, b, opR, opF) { if (a.r && b.r) return ex(opR(a.r, b.r)); return fl(opF(a.f, b.f)); }
  const add = (a, b) => bin(a, b, (x, y) => R(x.n * y.d + y.n * x.d, x.d * y.d), (x, y) => x + y);
  const sub = (a, b) => bin(a, b, (x, y) => R(x.n * y.d - y.n * x.d, x.d * y.d), (x, y) => x - y);
  const mul = (a, b) => bin(a, b, (x, y) => R(x.n * y.n, x.d * y.d), (x, y) => x * y);
  const div = (a, b) => bin(a, b, (x, y) => R(x.n * y.d, x.d * y.n), (x, y) => x / y);
  function isqrt(n) { if (n < 0n) return null; if (n < 2n) return n; let x = BigInt(Math.floor(Math.sqrt(Number(n)))); while (x * x > n) x--; while ((x + 1n) * (x + 1n) <= n) x++; return x * x === n ? x : null; }
  function sqrt(a) {
    if (a.f < 0) throw new Error("sqrt of negative");
    if (a.r) { const p = isqrt(a.r.n), q = isqrt(a.r.d); if (p !== null && q !== null) return ex(R(p, q)); }
    return fl(Math.sqrt(a.f));
  }
  function pow(a, b) {
    if (isInt(b) && b.r.n >= -3000n && b.r.n <= 3000n) {
      const e = b.r.n < 0n ? -b.r.n : b.r.n;
      if (a.r) { let n = 1n, d = 1n; for (let i = 0n; i < e; i++) { n *= a.r.n; d *= a.r.d; } return ex(b.r.n < 0n ? R(d, n) : R(n, d)); }
      return fl(Math.pow(a.f, Number(b.r.n)));
    }
    return fl(Math.pow(a.f, b.f));
  }
  function fact(a) { if (!isInt(a) || a.r.n < 0n || a.r.n > 300n) throw new Error("factorial"); let r = 1n; for (let i = 2n; i <= a.r.n; i++) r *= i; return ex(R(r)); }

  const SUP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "⁻": "-" };
  const VULG = { "½": "(1/2)", "⅓": "(1/3)", "¼": "(1/4)", "⅛": "(1/8)", "⅔": "(2/3)", "¾": "(3/4)", "⅞": "(7/8)" };
  function normalize(s) {
    s = String(s).trim().toLowerCase();
    for (const k in VULG) s = s.split(k).join(VULG[k]);
    s = s.replace(/[\u2212\u2013\u2014]/g, "-");
    s = s.replace(/[×✕✖·⋅∙•]/g, "*").replace(/÷/g, "/");
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, (m) => "^(" + [...m].map((c) => SUP[c]).join("") + ")");
    s = s.replace(/√/g, " sqrt ").replace(/square root of/g, " sqrt ").replace(/square root/g, " sqrt ").replace(/(^|[^q])root\s*(?=\d|\()/g, "$1 sqrt ");
    s = s.replace(/\s*\b(inches|inch|in|terms|term)\.?\s*$/g, "");
    s = s.replace(/^[a-z]\w*\s*=\s*/, "");
    s = s.replace(/(\d),(?=\d{3}(?!\d))/g, "$1");
    s = s.replace(/(\d|\))\s*x\s*(?=[\d(])/g, "$1*");
    return s.trim();
  }
  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (/[0-9.]/.test(ch)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; t.push({ k: "num", v: s.slice(i, j) }); i = j; continue; }
      if (s.startsWith("sqrt", i)) { t.push({ k: "S" }); i += 4; continue; }
      if ("+-*/^!()".includes(ch)) { t.push({ k: ch }); i++; continue; }
      throw new Error("bad char " + ch);
    }
    return t;
  }
  function parseNum(v) {
    if ((v.match(/\./g) || []).length > 1 || v === ".") throw new Error("num");
    if (v.includes(".")) { const [a, b] = v.split("."); return ex(R(BigInt((a || "0") + (b || "")), 10n ** BigInt((b || "").length))); }
    return ex(R(BigInt(v)));
  }
  function evaluate(src) {
    const t = tokenize(normalize(src)); let p = 0;
    const peek = () => t[p], eat = (k) => { if (!t[p] || t[p].k !== k) throw new Error("expected " + k); return t[p++]; };
    let ops = 0;
    function expr() { let a = term(); while (peek() && (peek().k === "+" || peek().k === "-")) { const o = t[p++].k; ops++; const b = term(); a = o === "+" ? add(a, b) : sub(a, b); } return a; }
    const startsFactor = (tk) => tk && (tk.k === "num" || tk.k === "(" || tk.k === "S");
    function term() {
      let a = unary();
      for (;;) {
        const tk = peek();
        if (tk && (tk.k === "*" || tk.k === "/")) { p++; ops++; const b = unary(); a = tk.k === "*" ? mul(a, b) : div(a, b); }
        else if (startsFactor(tk)) { ops++; a = mul(a, power()); }
        else break;
      }
      return a;
    }
    function unary() { if (peek() && peek().k === "-") { p++; return sub(ex(R(0n)), unary()); } if (peek() && peek().k === "+") { p++; return unary(); } return power(); }
    function power() { const a = post(); if (peek() && peek().k === "^") { p++; ops++; return pow(a, expo()); } return a; }
    function expo() { if (peek() && peek().k === "-") { p++; return sub(ex(R(0n)), power()); } return power(); }
    function post() { let a = prim(); while (peek() && peek().k === "!") { p++; ops++; a = fact(a); } return a; }
    function prim() {
      const tk = peek(); if (!tk) throw new Error("end");
      if (tk.k === "num") { p++; return parseNum(tk.v); }
      if (tk.k === "(") { p++; const a = expr(); eat(")"); return a; }
      if (tk.k === "S") { p++; ops++; return sqrt(post()); }
      throw new Error("unexpected " + tk.k);
    }
    const v = expr(); if (p !== t.length) throw new Error("trailing");
    return { v, ops };
  }
  function tryEval(s) { try { return evaluate(s); } catch (e) { return null; } }
  const showR = (r) => (r.d === 1n ? r.n.toString() : r.n + "/" + r.d);
  const key = (v) => (v.r ? showR(v.r) : null);
  function same(a, b) {
    if (a.r && b.r) return a.r.n === b.r.n && a.r.d === b.r.d;
    return Math.abs(a.f - b.f) <= 1e-9 * Math.max(1, Math.abs(b.f));
  }
  function want(x) { const e = tryEval(String(x)); if (!e) throw new Error("bad answer key " + x); return e.v; }
  function splitList(s) {
    const n = String(s).replace(/\band\b|\bor\b|&|;/gi, ",");
    const parts = n.split(/\s*,\s*/).map((x) => x.trim()).filter(Boolean);
    const out = [];
    for (const pt of parts) {
      const m = pt.match(/^(±|\+-|\+\/-|plus or minus)\s*(.+)$/i);
      if (m) { out.push(m[2]); out.push("-(" + m[2] + ")"); } else out.push(pt);
    }
    return out;
  }
  const fmtV = (v) => (v.r ? (v.r.d === 1n ? v.r.n.toLocaleString("en-US") : showR(v.r)) : (Math.round(v.f * 1e6) / 1e6).toString());
  const short = (v) => { const s = fmtV(v); return s.length > 14 ? "(a long number)" : s; };

  /* ---- constructions: input "first term, ratio" ---- */
  function seqTerms(a, r, K) { const out = []; let t = a; for (let i = 0; i < K; i++) { out.push(t); t = mul(t, r); } return out; }
  function bits(v) { return v.r ? v.r.n.toString(2).length + v.r.d.toString(2).length : 0; }
  function construct(step, raw) {
    const parts = splitList(raw);
    if (parts.length !== 2) return { ok: false, kind: "count", msg: "Give two things: the first term and the ratio, like “6, 1/5”." };
    const ea = tryEval(parts[0]), er = tryEval(parts[1]);
    if (!ea || !er) return { ok: false, kind: "unread", msg: "I couldn't read that. Try “first term, ratio”, e.g. 6, 1/5." };
    const a = ea.v, r = er.v;
    if (a.f === 0) return { ok: false, kind: "wrong", msg: "With a first term of 0 every rung is 0." };
    const sp = step.special;
    if (sp === "p16") {
      if (r.r) {
        if (r.r.d === 1n) return { ok: false, kind: "wrong", msg: "That ratio is a whole number. The problem wants a ratio that isn't." };
        return { ok: false, kind: "wrong", msg: "With a fraction for the ratio, its bottom number piles up on every rung, so the whole numbers run out. List ten rungs and see." };
      }
      const fs = []; let t = a.f;
      for (let i = 0; i < 60 && Math.abs(t) < 1e9; i++) { fs.push(t); t *= r.f; }
      const ints = fs.map((x, i) => (Math.abs(x - Math.round(x)) < 1e-7 && Math.abs(x) >= 0.5 ? i : -1)).filter((i) => i >= 0);
      const lastThird = ints.filter((i) => i >= (2 * fs.length) / 3).length;
      if (fs.length >= 12 && ints.length >= 6 && lastThird >= 1) return { ok: true };
      return { ok: false, kind: "wrong", msg: "Your rungs: " + fs.slice(0, 6).map((x) => Math.round(x * 1000) / 1000).join(", ") + ", … Whole numbers don't keep coming back." };
    }
    if (!a.r || !r.r) return { ok: false, kind: "unread", msg: "For this one use whole numbers or fractions for both (no square roots), so the rungs can be checked exactly." };
    if (a.f <= 0 || r.f <= 0) return { ok: false, kind: "wrong", msg: "Every rung must be positive, so the first term and the ratio must both be positive." };
    if (r.r.n === r.r.d) return { ok: false, kind: "wrong", msg: "A ratio of 1 makes every rung the same." };
    if (sp === "p17a" || sp === "l6") {
      const need = sp === "p17a" ? 3 : 2;
      if (r.r.d === 1n && isInt(a)) return { ok: false, kind: "wrong", msg: "A whole-number first term times a whole-number ratio gives a whole number on every rung: infinitely many." };
      const K = Math.max(300, bits(a) + 60);
      const ts = seqTerms(a, r, K);
      const ints = ts.map((x, i) => (x.r.d === 1n ? i : -1)).filter((i) => i >= 0);
      if (ints.length && ints[ints.length - 1] > K - 30) return { ok: false, kind: "wrong", msg: "Whole numbers keep appearing far down your ladder, so there are too many." };
      if (ints.length === need) return { ok: true };
      return { ok: false, kind: ints.length > need ? "big" : "small", msg: "Your rungs: " + ts.slice(0, 6).map(short).join(", ") + ", … That has " + ints.length + " whole number" + (ints.length === 1 ? "" : "s") + " in it." };
    }
    if (sp === "p17b") {
      const K = Math.max(2100, bits(a) + 80);
      const ts = seqTerms(a, r, K);
      const firstBad = ts.findIndex((x) => x.r.d !== 1n);
      const later = ts.slice(2015).some((x) => x.r.d === 1n);
      if (firstBad === 2015 && !later) return { ok: true };
      if (firstBad === -1 || later) return { ok: false, kind: "big", msg: "Whole numbers still appear after rung 2015." };
      return { ok: false, kind: "small", msg: "The first rung that isn't a whole number is rung " + (firstBad + 1) + ". It has to be rung 2016." };
    }
    return { ok: false, kind: "unread", msg: "Unknown construction." };
  }

  /* grade(step, input, others) -> {ok, msg, kind} ; others = answers of the problem's other steps */
  function grade(step, input, others) {
    others = others || [];
    const raw = String(input || "").trim();
    if (!raw) return { ok: false, kind: "empty", msg: "Type an answer first." };
    const type = step.type;
    if (type === "yn") {
      const y = /^(y|yes|true)\b/i.test(raw), n = /^(n|no|false)\b/i.test(raw);
      if (!y && !n) return { ok: false, kind: "unread", msg: "Answer yes or no." };
      if (y === !!step.ans) return { ok: true };
      const nm = step.named && step.named[y ? "yes" : "no"];
      return { ok: false, kind: nm ? "named" : "wrong", msg: nm || "Not quite. Look at the question again." };
    }
    if (type === "choice") {
      const wantL = String(step.ans).toLowerCase();
      let got = raw.toLowerCase().replace(/[().\s]/g, "");
      if (!/^[a-e]$/.test(got) && step.optvals) {
        const e = tryEval(raw);
        if (e) { const k = step.optvals.findIndex((o) => o !== null && same(e.v, want(o))); if (k >= 0) got = "abcde"[k]; }
      }
      if (!/^[a-e]$/.test(got)) return { ok: false, kind: "unread", msg: "Answer with a letter, A to E." };
      if (got === wantL) return { ok: true };
      if (step.named && step.named[got]) return { ok: false, kind: "named", msg: step.named[got] };
      return { ok: false, kind: "wrong", msg: "Not that one." };
    }
    if (type === "construct") return construct(step, raw);
    if (type === "nums") {
      const parts = splitList(raw), vals = [];
      for (const pt of parts) { const e = tryEval(pt); if (!e) return { ok: false, kind: "unread", msg: "I couldn't read that list. Try “2 and −2” or “±2”." }; vals.push(e.v); }
      const W = step.ans.map(want);
      const used = new Set();
      let hits = 0;
      vals.forEach((v) => { const k = W.findIndex((w, i) => !used.has(i) && same(v, w)); if (k >= 0) { used.add(k); hits++; } });
      if (hits === W.length && vals.length === W.length) return { ok: true };
      const nk = vals.map(key).join(",");
      if (step.named && step.named[nk]) return { ok: false, kind: "named", msg: step.named[nk] };
      if (hits === vals.length && vals.length < W.length) return { ok: false, kind: "partial", msg: "That's one of them, and there is more than one." };
      if (vals.length > W.length) return { ok: false, kind: "wrong", msg: "Too many values." };
      if (hits === W.length - 1 && vals.length === W.length) return { ok: false, kind: "oneoff", msg: "One value is right and one is off." };
      if (vals.length === 1 && W.some((w) => Math.abs(vals[0].f + w.f) <= 1e-9 * Math.max(1, Math.abs(w.f)))) return { ok: false, kind: "wrong", msg: "Right size; check the sign." };
      return { ok: false, kind: "wrong", msg: "Those aren't the values." };
    }
    // num
    const e = tryEval(raw);
    if (!e) {
      if (/^(±|\+-|\+\/-)/.test(raw) || /\band\b|,/.test(raw)) return { ok: false, kind: "unread", msg: "This step has one value." };
      return { ok: false, kind: "unread", msg: "I couldn't read that. Try a number, a fraction like 3/16, or an expression like 5·3⁶." };
    }
    const v = e.v, w = want(step.ans);
    if (same(v, w)) return { ok: true, value: v };
    const k = key(v);
    if (k && step.named && step.named[k]) return { ok: false, kind: "named", msg: step.named[k] };
    for (let i = 0; i < others.length; i++) {
      const o = others[i];
      if (o === null || o === undefined || Array.isArray(o)) continue;
      const ov = tryEval(String(o));
      if (ov && same(ov.v, v)) return { ok: false, kind: "otherstep", msg: `That's step ${i + 1}'s answer.` };
    }
    if (w.f !== 0 && Math.abs(v.f + w.f) <= 1e-9 * Math.max(1, Math.abs(w.f))) return { ok: false, kind: "sign", msg: "Right size, wrong sign." };
    if (w.f !== 0 && v.f !== 0 && Math.abs(w.f) !== 1 && Math.abs(v.f * w.f - 1) < 1e-9) return { ok: false, kind: "flip", msg: "That's upside down." };
    const diff = Math.abs(v.f - w.f);
    if (diff <= 0.02 * Math.abs(w.f)) return { ok: false, kind: "close", msg: "Very close. Recheck the arithmetic." };
    if (v.f > w.f) return { ok: false, kind: "big", msg: "Too big." };
    return { ok: false, kind: "small", msg: "Too small." };
  }
  return { grade, evaluate: (s) => { const e = tryEval(s); return e ? fmtV(e.v) : null; }, normalize, _eval: tryEval };
})();

<script>
/* Step-through story: one picture per frame, Back/Next, progress dots, Show all, ←/→ when focused. */
window.STORY = (function () {
  "use strict";
  function setup(st) {
    if (st.dataset.ready) return;
    st.dataset.ready = "1";
    const frames = Array.from(st.querySelectorAll(":scope .frame"));
    const dots = st.querySelector(".dots"), back = st.querySelector("[data-act=back]"), next = st.querySelector("[data-act=next]");
    const all = st.querySelector("input.showall"), name = st.querySelector(".stepname");
    const marks = Array.from(st.querySelectorAll(".plan-side li[data-s], .plan-strip span[data-s]"));
    const skipped = new Set(frames.filter((f) => f.classList.contains("skip")).map((f) => f.dataset.step));
    marks.forEach((m) => m.classList.toggle("skipd", skipped.has(m.dataset.s)));
    let i = 0;
    const seen = new Set([0]);
    frames.forEach((f, k) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "Picture " + (k + 1) + " of " + frames.length);
      b.addEventListener("click", () => go(k));
      dots.appendChild(b);
    });
    function go(k) { i = Math.max(0, Math.min(frames.length - 1, k)); seen.add(i); render(); }
    function render() {
      frames.forEach((f, k) => f.classList.toggle("on", k === i));
      Array.from(dots.children).forEach((b, k) => { b.classList.toggle("on", k === i); b.classList.toggle("seen", seen.has(k) && k !== i); });
      back.disabled = i === 0;
      next.disabled = i === frames.length - 1;
      const s = frames[i] && frames[i].dataset.step;
      marks.forEach((m) => m.classList.toggle("on", s && m.dataset.s === s));
      if (name) name.textContent = s && st.dataset.plan ? JSON.parse(st.dataset.plan)[+s - 1] : "";
    }
    back.addEventListener("click", () => go(i - 1));
    next.addEventListener("click", () => go(i + 1));
    st.addEventListener("keydown", (e) => {
      if (e.target.closest("input,textarea,select")) return;
      if (e.key === "ArrowRight") { go(i + 1); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { go(i - 1); e.preventDefault(); }
    });
    all.addEventListener("change", () => st.classList.toggle("all", all.checked));
    st._go = go;
    render();
  }
  function init(root) { (root || document).querySelectorAll(".story").forEach(setup); }
  document.addEventListener("DOMContentLoaded", () => init());
  return { init };
})();

<script>
/* Workbench: problem rail, tabs, per-step grading loop, hint dialog, submit/reveal, timer, deep links.
   Nothing is stored between visits (no browser storage is used); ink is kept per problem in window.INK. */
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("bench-data").textContent);
  const P = DATA.problems, byId = {};
  P.forEach((p) => (byId[p.id] = p));
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---- ink per problem ---- */
  const inkStore = {};
  window.INK = { get: (id) => inkStore[id] || [], set: (id, strokes) => { inkStore[id] = strokes; } };

  /* ---- state ---- */
  const S = {};
  P.forEach((p) => {
    S[p.id] = { time: 0, cur: 0, revealed: false, submitted: false, confirmArmed: 0,
      steps: p.steps.map(() => ({ tries: 0, misses: 0, state: "open", work: "", hints: 0, answers: [] })) };
  });
  let cur = null, tab = DATA.page === "lesson" ? "concept" : "problem", lastTick = Date.now();

  function status(id) {
    const s = S[id];
    if (s.revealed || s.steps.every((x) => x.state !== "open")) return "closed";
    if (s.steps.some((x) => x.tries || x.work.trim() || x.hints)) return "prog";
    return "untouched";
  }
  function finished() { return P.filter((p) => status(p.id) === "closed").length; }

  /* ---- console ---- */
  function log(msg, cls) {
    const c = $("console");
    const d = el("div", cls || "");
    const t = new Date();
    d.innerHTML = '<span class="ts">' + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") + "</span>" + msg;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
    if (cur) (S[cur].log = S[cur].log || []).push(d.outerHTML);
  }

  /* ---- top bar and rail ---- */
  function buildNav() {
    const sel = $("psel"), rail = $("rail");
    let lastSec = null, og = null;
    P.forEach((p) => {
      if (p.section !== lastSec) {
        og = el("optgroup"); og.label = p.section; sel.appendChild(og);
        rail.appendChild(el("h4", "", esc(p.section)));
        lastSec = p.section;
      }
      const o = el("option"); o.value = p.id; o.textContent = p.label; og.appendChild(o);
      const b = el("button", "", '<span class="sdot" aria-hidden="true"></span><span></span>');
      b.type = "button"; b.dataset.id = p.id; b.lastChild.textContent = p.label;
      b.setAttribute("aria-label", p.label);
      b.addEventListener("click", () => { select(p.id); rail.classList.remove("open"); });
      rail.appendChild(b);
    });
    sel.addEventListener("change", () => select(sel.value));
    $("prev").addEventListener("click", () => step(-1));
    $("next").addEventListener("click", () => step(1));
    $("railToggle").addEventListener("click", () => $("rail").classList.toggle("open"));
  }
  function step(d) { const i = P.findIndex((p) => p.id === cur); select(P[(i + d + P.length) % P.length].id); }
  function refreshNav() {
    $("psel").value = cur;
    document.querySelectorAll("#rail button[data-id]").forEach((b) => {
      b.classList.toggle("cur", b.dataset.id === cur);
      const st = status(b.dataset.id);
      b.firstChild.className = "sdot" + (st === "prog" ? " prog" : st === "closed" ? " closed" : "");
      b.setAttribute("aria-label", byId[b.dataset.id].label + " (" + (st === "untouched" ? "not started" : st === "prog" ? "in progress" : "finished") + ")");
    });
    $("finished").textContent = finished() + " / " + P.length + " finished";
  }

  /* ---- timer ---- */
  function tick() {
    const now = Date.now();
    if (cur && !document.hidden) S[cur].time += now - lastTick;
    lastTick = now;
    if (cur) { const s = Math.floor(S[cur].time / 1000); $("timer").textContent = "⏱ " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  }
  setInterval(tick, 1000);

  /* ---- tabs ---- */
  function setTab(t) {
    tab = t;
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    document.querySelectorAll(".tabpanel").forEach((pn) => (pn.hidden = pn.id !== "tab-" + t));
    if (t === "steps") renderMySteps();
  }

  /* ---- middle pane ---- */
  function renderProblem() {
    const p = byId[cur], s = S[cur], box = $("tab-problem");
    let h = '<h2>' + esc(p.label) + "</h2>";
    h += '<div class="ptext">' + esc(p.text) + (p.figure ? '<div class="pfig">' + p.figure + "</div>" : "") + "</div>";
    let meta = "";
    if (p.inclass) meta += '<span class="inclass" title="time in your class video">In class ' + esc(p.inclass) + "</span>";
    if (p.above) meta += '<span class="above">Above grade: split into steps</span>';
    if (meta) h += '<p class="pnote">' + meta + "</p>";
    if (p.note) h += '<p class="pnote">' + esc(p.note) + "</p>";
    const open = s.revealed || s.submitted;
    if (open) {
      h += '<div class="verified" id="verified"><h3>Verified answer: ' + esc(p.answer) + "</h3><p>" + esc(p.check) + "</p>" +
        "<h3>Worked answer</h3>" + p.story + "</div>";
    } else {
      h += '<p class="pnote">The worked answer appears here after you close every step and press <b>Submit question</b>.</p>';
    }
    box.innerHTML = h;
    if (open) window.STORY.init(box);
    if (DATA.page === "lesson") {
      $("tab-concept").innerHTML = DATA.concepts[p.concept];
      window.STORY.init($("tab-concept"));
    }
  }
  function renderMySteps() {
    const p = byId[cur], s = S[cur];
    let h = '<div class="mysteps">';
    p.steps.forEach((st, i) => {
      const x = s.steps[i];
      const res = x.state === "ok" ? "✓ closed" : x.state === "handed" ? "answer handed over" : x.tries ? "open (" + x.tries + " tries)" : "not tried";
      h += '<div class="ms"><b>Step ' + (i + 1) + ":</b> " + esc(st.q) + '<br><span class="pnote">' + res + (x.hints ? ", hint opened" : "") +
        "</span>" + (x.work.trim() ? "<pre>" + esc(x.work) + "</pre>" : "") +
        (x.answers.length ? '<span class="pnote">Answers tried: ' + x.answers.map(esc).join(" · ") + "</span>" : "") + "</div>";
    });
    $("tab-steps").innerHTML = h + "</div>";
  }

  /* ---- right pane ---- */
  function renderRight() {
    const p = byId[cur], s = S[cur], st = p.steps[s.cur], x = s.steps[s.cur];
    const pills = $("pills");
    pills.innerHTML = "";
    p.steps.forEach((_, i) => {
      const b = el("button");
      b.type = "button";
      b.textContent = "Step " + (i + 1);
      const xi = s.steps[i];
      b.className = (i === s.cur ? "cur " : "") + (xi.state === "ok" ? "ok" : xi.state === "handed" ? "handed" : xi.tries ? "tried" : "");
      b.setAttribute("aria-label", "Step " + (i + 1) + (xi.state === "ok" ? ", closed" : xi.state === "handed" ? ", handed over" : ", open"));
      b.addEventListener("click", () => { saveWork(); s.cur = i; renderRight(); });
      pills.appendChild(b);
    });
    $("stepq").textContent = st.q;
    $("work").value = x.work;
    syncGutter();
    $("answer").value = "";
    $("answer").placeholder = st.ph;
    const closed = x.state !== "open";
    $("answer").disabled = closed;
    $("check").disabled = closed;
    $("hint").disabled = closed;
    $("stepstate").textContent = x.state === "ok" ? "Step closed. " + st.ok : x.state === "handed" ? "Answer handed over: " + st.reveal : (x.misses === 3 ? "One final attempt on this step." : "");

    $("confirmNote").textContent = "";
    s.confirmArmed = 0;
  }
  function saveWork() { if (cur) S[cur].steps[S[cur].cur].work = $("work").value; }
  function syncGutter() {
    const n = Math.max(6, $("work").value.split("\n").length);
    $("gutter").innerHTML = Array.from({ length: n }, (_, i) => i + 1).join("<br>");
    $("gutter").scrollTop = $("work").scrollTop;
  }

  /* ---- grading loop ---- */
  function nextOpen(s) {
    const n = s.steps.length;
